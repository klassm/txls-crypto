services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: txls_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d txls_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpass
      MARIADB_DATABASE: txls_test
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--user=root", "--password=rootpass"]
      interval: 5s
      timeout: 5s
      retries: 5
