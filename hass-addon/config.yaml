name: "TXLS Crypto"
description: "Cryptocurrency transaction analysis platform. Import CSV data from Bitpanda/TradeRepublic, calculate taxes, and track holdings."
version: "2026.3.24"
slug: "txls_crypto"
url: "https://github.com/klassm/txls-crypto/tree/main/hass-addon"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 3000
ports:
  3000/tcp: null
panel_icon: mdi:bitcoin
panel_admin: false
homeassistant_api: true
hassio_api: true
map:
  - config:rw
  - share:rw
options:
  jwt_secret: ""
  db_connection_string: "/data/txls.db"
  log_level: "info"
  api_sync_enabled: true
  api_sync_interval: "0 3 * * *"
  encryption_key: ""
schema:
  jwt_secret: str
  db_connection_string: str
  log_level: list(info|debug|warn|error)
  api_sync_enabled: bool
  api_sync_interval: str
  encryption_key: str?
environment:
  HOSTNAME: "0.0.0.0"
  NODE_ENV: "production"

