events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 3000;
        server_name _;

        root /app/client/dist;
        index index.html;

        # Home Assistant ingress - API proxy
        location ~ ^/api/hassio_ingress/(?<session>[^/]+)/api/(.*)$ {
            proxy_pass http://127.0.0.1:3001/api/$2;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Ingress-Path "/api/hassio_ingress/$session";
            proxy_set_header Authorization $http_authorization;
        }

        # Home Assistant ingress - static assets  
        location ~ ^/api/hassio_ingress/[^/]+/assets/(.*)$ {
            alias /app/client/dist/assets/$1;
        }

        # Home Assistant ingress - base path (no trailing path)
        location ~ ^/api/hassio_ingress/[^/]+$ {
            return 301 $uri/;
        }

        # Home Assistant ingress - base path with trailing slash
        location ~ ^/api/hassio_ingress/[^/]+/$ {
            try_files /index.html =404;
        }

        # Home Assistant ingress - paths with content
        location ~ ^/api/hassio_ingress/[^/]+/(.+)$ {
            try_files /$1 /$1/ /index.html =404;
        }

        # Deny all direct access
        location / {
            return 404;
        }
    }
}
