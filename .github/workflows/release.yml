name: Release

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version:' hass-addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          
          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%-m)
          
          if [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${CURRENT_VERSION%%.*}" -lt 2000 ]]; then
            NEW_VERSION="${CURRENT_YEAR}.${CURRENT_MONTH}"
          elif [[ "$CURRENT_VERSION" =~ ^([0-9]{4})\.([0-9]+)\.([0-9]+)$ ]]; then
            YEAR="${BASH_REMATCH[1]}"
            MONTH="${BASH_REMATCH[2]}"
            INCREMENT="${BASH_REMATCH[3]}"
            
            if [[ "$YEAR" -eq "$CURRENT_YEAR" ]] && [[ "$MONTH" -eq "$CURRENT_MONTH" ]]; then
              NEW_VERSION="${YEAR}.${MONTH}.$((INCREMENT + 1))"
            else
              NEW_VERSION="${CURRENT_YEAR}.${CURRENT_MONTH}"
            fi
          elif [[ "$CURRENT_VERSION" =~ ^([0-9]{4})\.([0-9]+)$ ]]; then
            YEAR="${BASH_REMATCH[1]}"
            MONTH="${BASH_REMATCH[2]}"
            
            if [[ "$YEAR" -eq "$CURRENT_YEAR" ]] && [[ "$MONTH" -eq "$CURRENT_MONTH" ]]; then
              NEW_VERSION="${YEAR}.${MONTH}.1"
            else
              NEW_VERSION="${CURRENT_YEAR}.${CURRENT_MONTH}"
            fi
          else
            echo "Error: Unable to parse version format: $CURRENT_VERSION"
            exit 1
          fi
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    needs: calculate-version

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Run unit tests
        run: pnpm run test:unit

  release:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test]
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update config.yaml
        run: |
          VERSION="${{ needs.calculate-version.outputs.version }}"
          sed -i "s/^version: *\".*\"/version: \"$VERSION\"/" hass-addon/config.yaml

      - name: Update Dockerfile
        run: |
          VERSION="${{ needs.calculate-version.outputs.version }}"
          sed -i "s|^FROM ghcr.io/klassm/txls-crypto:.*|FROM ghcr.io/klassm/txls-crypto:$VERSION|" hass-addon/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.calculate-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Commit and push version bump
        run: |
          VERSION="${{ needs.calculate-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hass-addon/config.yaml hass-addon/Dockerfile
          git commit -m "chore: release $VERSION"
          git push origin HEAD:main
          echo "Released version $VERSION"
