name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: pnpm/action-setup@v6
      with:
        version: 11.15.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Build application
      run: pnpm run build
      env:
        NODE_ENV: production
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: build-artifacts
        path: |
          shared/dist
          server/dist
          client/dist
        retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: pnpm/action-setup@v6
      with:
        version: 11.15.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts
    
    - name: Run linter
      run: pnpm run lint

  test-unit:
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: pnpm/action-setup@v6
      with:
        version: 11.15.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts

    - name: Run unit tests
      run: pnpm run test:unit
      env:
        JWT_SECRET: test-secret-key-for-jwt-signing-in-tests-sufficiently-long

  test-integration:
    runs-on: ubuntu-latest
    needs: [build]
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: txls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:9.7
        env:
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: txls_test
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: pnpm/action-setup@v6
      with:
        version: 11.15.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts
    
    - name: Run PostgreSQL integration tests
      run: pnpm run test:integration:postgres
      env:
        JWT_SECRET: test-secret-key-for-jwt-signing-in-tests-sufficiently-long
    
    - name: Run MySQL integration tests
      run: pnpm run test:integration:mysql
      env:
        JWT_SECRET: test-secret-key-for-jwt-signing-in-tests-sufficiently-long

  test-gui-local:
    runs-on: ubuntu-latest
    needs: [build]

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: txls_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts

      - name: Install Playwright Browsers
        run: pnpm --filter @txls/gui-tests exec playwright install --with-deps chromium

      - name: Run GUI tests (local dev)
        run: pnpm run test:gui:local
        env:
          DB_CONNECTION_STRING: mysql://root:root@127.0.0.1:3306/txls_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-local
          path: gui-tests/playwright-report/
          retention-days: 30

  test-gui-docker:
    runs-on: ubuntu-latest
    needs: [build]

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: txls_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts

      - name: Install Playwright Browsers
        run: pnpm --filter @txls/gui-tests exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          cache-from: type=gha,scope=txls-docker
          cache-to: type=gha,mode=max,scope=txls-docker
          push: false
          load: true
          tags: txls-docker-test

      - name: Run GUI tests (Docker)
        run: pnpm run test:gui:docker
        env:
          DB_CONNECTION_STRING: mysql://root:root@127.0.0.1:3306/txls_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-docker
          path: gui-tests/playwright-report/
          retention-days: 30

  test-gui-hass:
    runs-on: ubuntu-latest
    needs: [build]

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: txls_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts

      - name: Install Playwright Browsers
        run: pnpm --filter @txls/gui-tests exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hass
          cache-from: type=gha,scope=txls-hass
          cache-to: type=gha,mode=max,scope=txls-hass
          push: false
          load: true
          tags: txls-hass-test

      - name: Run GUI tests (Home Assistant ingress)
        run: pnpm run test:gui:hass
        env:
          DB_CONNECTION_STRING: mysql://root:root@127.0.0.1:3306/txls_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-hass
          path: gui-tests/playwright-report/
          retention-days: 30
